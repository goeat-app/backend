version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: goeat-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: goeat-admin
      POSTGRES_DB: goeat_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d goeat_db']
      interval: 10s
      timeout: 5s
      retries: 5

  firebase-emulator:
    build:
      context: .
      dockerfile: docker/firebase-emulator/Dockerfile
    container_name: goeat-firebase-emulator
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://admin:goeat-admin@postgres:5432/goeat_db
      EMULATOR_PROJECT_ID: demo-goeat
      FEATURE_VERSION: restaurant_recommendation_v1
      FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
      RECOMMENDER_SYSTEM_URL: http://host.docker.internal:5000
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
    ports:
      - '9099:9099'
      - '5001:5001'
      - '4000:4000'
    volumes:
      - firebase_emulator_data:/data
      - ./ml/artifacts:/workspace/ml/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4000']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  firebase_emulator_data:
