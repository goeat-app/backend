services:
  postgres:
    image: postgres:16-alpine
    container_name: goeat-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: goeat-admin
      POSTGRES_DB: goeat_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d goeat_db']
      interval: 10s
      timeout: 5s
      retries: 5

  firebase-emulator:
    build:
      context: .
      dockerfile: docker/firebase-emulator/Dockerfile
    container_name: goeat-firebase-emulator
    working_dir: /workspace
    command: firebase emulators:start --only functions,auth
    env_file:
      - .env
    environment:
      EMULATOR_PROJECT_ID: demo-goeat
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '9099:9099'
      - '5001:5001'
      - '4000:4000'
      - '9199:9199'
    volumes:
      - .:/workspace
      - firebase_node_modules:/workspace/node_modules
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4000']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  firebase_node_modules:
