version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: goeat-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: goeat-admin
      POSTGRES_DB: goeat_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d goeat_db']
      interval: 10s
      timeout: 5s
      retries: 5

  firebase-emulator:
    build:
      context: ./docker/firebase-emulator
    container_name: goeat-firebase-emulator
    environment:
      EMULATOR_PROJECT_ID: demo-goeat
    ports:
      - '9099:9099'
      - '4000:4000'
    volumes:
      - ./docker/firebase-emulator/data:/data
      - ./docker/firebase-emulator/seed-users.sh:/seed-users.sh
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4000']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
