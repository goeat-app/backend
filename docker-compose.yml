services:
  postgres:
    image: postgres:16-alpine
    container_name: goeat-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: goeat-admin
      POSTGRES_DB: goeat_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d goeat_db']
      interval: 10s
      timeout: 5s
      retries: 5

  firebase-emulator:
    build:
      context: .
      dockerfile: docker/firebase-emulator/Dockerfile
    container_name: goeat-firebase-emulator
    working_dir: /workspace
    command: firebase emulators:start --only functions,auth,storage
    env_file:
      - .env
    environment:
      EMULATOR_PROJECT_ID: demo-goeat
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:goeat-admin@postgres:5432/goeat_db
      EMULATOR_PROJECT_ID: demo-goeat
      FEATURE_VERSION: restaurant_recommendation_v1
      AUTH_EMULATOR_HOST: localhost:9099
      MODEL_PATH: /workspace/ml/artifacts/restaurant_ranker_v1/model
      MODEL_VERSION: restaurant_ranker_v1
      PREDICTION_ALLOW_HEURISTIC: ${PREDICTION_ALLOW_HEURISTIC:-true}
      PREDICTION_SERVICE_URL: http://localhost:5001/demo-goeat/us-central1
      PREDICTION_SERVICE_TOKEN: ${PREDICTION_SERVICE_TOKEN:-local-prediction-token}
    ports:
      - '9099:9099'
      - '5001:5001'
      - '4000:4000'
      - '9199:9199'
    volumes:
      - firebase_emulator_data:/data
      - ./ml/artifacts:/workspace/ml/artifacts:ro
      - .:/workspace
      - firebase_node_modules:/workspace/node_modules
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4000']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  firebase_emulator_data:
  firebase_node_modules:
